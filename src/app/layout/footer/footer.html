<footer class="site-footer">
  <div class="footer-content container">
    <div>
      <a class="brand" routerLink="/" aria-label="Kei.Roumanie — Accueil">
        <span class="brand-name__kei">Kei</span>.Roumanie
      </a>
      <p class="tagline">Étudier · S'engager · Réussir</p>
    </div>

    <nav class="footer-navigation" aria-label="Navigation de pied de page">
      <a routerLink="/a-propos">À propos</a>
      <a routerLink="/roumanie">La Roumanie</a>
      <a routerLink="/tarifs">Tarifs</a>
      <div class="contact-links">
        <a routerLink="/contact">Contact</a>
        <a
          class="instagram-link"
          href="https://www.instagram.com/kei.roumanie/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Suivre Kei.Roumanie sur Instagram"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="instagram-dot" cx="17.5" cy="6.5" r="1"></circle>
          </svg>
        </a>
      </div>
    </nav>
  </div>

  <div class="copyright container">
    <p>
      © {{ currentYear }} <span class="brand-name__kei">Kei</span>.Roumanie. Tous droits réservés.
    </p>
    <button class="legal-link" type="button" (click)="legalDialog.showModal()">
      Mentions légales
    </button>
  </div>

  <dialog
    #legalDialog
    class="legal-dialog"
    aria-labelledby="legal-title"
    (click)="closeOnBackdrop($event, legalDialog)"
  >
    <div class="legal-dialog__content">
      <div class="legal-dialog__header">
        <h2 id="legal-title">Mentions légales</h2>
        <button
          class="legal-dialog__close"
          type="button"
          aria-label="Fermer les mentions légales"
          (click)="legalDialog.close()"
        >
          ×
        </button>
      </div>
      <p>Entreprise en cours de création</p>
    </div>
  </dialog>
</footer>
